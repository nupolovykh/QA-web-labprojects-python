name: Dependency auto-merge

# Merges Dependabot pull requests into `deps` once CI is green on the commit
# being merged. Nothing reaches main from here — see deps-promote.yml.
#
# Runs via workflow_run, not pull_request: a run raised by Dependabot gets a
# read-only token, while workflow_run executes with write access using the
# copy of this file on the default branch.
#
# No checkout anywhere — every step is an API call, so there's no script on
# disk for a push to `deps` to poison. No semver filter either: a breaking
# bump just fails CI and stays unmerged, the same outcome by a shorter route.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Safety net for events that never arrive (a force-push, a rebase mid-run).
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on `deps` and hand off to deps-promote.yml

# Avoids two sweeps merging onto a branch that moved under one of them.
concurrency:
  group: dependency-auto-merge
  cancel-in-progress: false

jobs:
  sweep:
    # workflow_run fires for every CI run in the repo; only pull_request ones matter here.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.DEPS_PAT }}
      REPO: ${{ github.repository }}
      DEPS_BRANCH: deps
      BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      CI_WORKFLOW: ci.yml
      # Days an update may sit unmerged before this run turns red — the one
      # notification an unattended repo actually gets.
      STALE_DAYS: "14"
    steps:
      - name: Merge Dependabot pull requests that passed CI
        id: sweep
        run: |
          set -euo pipefail

          merged=0
          stuck=0
          summary=()

          note() { summary+=("$1"); printf '   %s\n' "$1"; }

          finish() {
            echo "merged=${merged}" >>"$GITHUB_OUTPUT"
            if [ "${#summary[@]}" -gt 0 ]; then
              {
                echo "### Dependency auto-merge"
                echo
                printf -- '- %s\n' "${summary[@]}"
              } >>"$GITHUB_STEP_SUMMARY"
            fi
          }
          trap finish EXIT

          now=$(date -u +%s)
          age_days() { echo $(( (now - $(date -u -d "$1" +%s)) / 86400 )); }

          # Posts a comment at most once per (PR, marker). Comments are read into a
          # variable before grepping, not piped, so a SIGPIPE from `gh` mid-write
          # under pipefail can't make a present marker read as absent.
          comment_once() {
            local number="$1" marker="$2" body="$3" existing
            existing=$(gh api --paginate "repos/$REPO/issues/${number}/comments?per_page=100" --jq '.[].body')
            if grep -qF "$marker" <<<"$existing"; then
              return 1
            fi
            gh api "repos/$REPO/issues/${number}/comments" -f "body=${body}

          ${marker}" >/dev/null
          }

          numbers=$(gh api --paginate \
            "repos/$REPO/pulls?state=open&base=${DEPS_BRANCH}&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | select(.draft | not) | .number')

          if [ -z "$numbers" ]; then
            echo "No open Dependabot pull requests against ${DEPS_BRANCH}."
          fi

          for number in $numbers; do
            pr=$(gh api "repos/$REPO/pulls/${number}")
            head_sha=$(jq -r '.head.sha' <<<"$pr")
            title=$(jq -r '.title' <<<"$pr")
            author=$(jq -r '.user.login' <<<"$pr")
            age=$(age_days "$(jq -r '.created_at' <<<"$pr")")

            echo ""
            echo "#${number} ${title}"
            echo "   head ${head_sha}  age ${age}d"

            # Re-check authorship on the PR object itself; workflow_run.actor and
            # the branch name both just reflect whoever pushed last.
            if [ "$author" != "dependabot[bot]" ]; then
              note "#${number}: author is ${author}, not dependabot[bot]; skipped"
              continue
            fi

            # Conclusion of the newest CI run on this exact commit.
            conclusion=$(gh api \
              "repos/$REPO/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${head_sha}&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"')

            case "$conclusion" in
              success) ;;
              pending)
                note "#${number}: CI has not finished on ${head_sha:0:7}"
                [ "$age" -ge "$STALE_DAYS" ] && stuck=1 && note "#${number}: open ${age}d with no CI verdict"
                continue
                ;;
              *)
                note "#${number}: CI concluded '${conclusion}'; left open for a human"
                if [ "$age" -ge "$STALE_DAYS" ]; then
                  stuck=1
                  note "#${number}: RED for ${age}d — this update is not landing"
                fi
                comment_once "$number" "<!-- auto-merge:failed:${head_sha} -->" \
          "CI concluded \`${conclusion}\` on \`${head_sha:0:7}\`, so this was not merged into \`${DEPS_BRANCH}\`.

          The gate leaves it open on purpose — a dependency that breaks the build is what it exists to catch. Fix it or close it; nothing else will move it." || true
                continue
                ;;
            esac

            # mergeable is computed async; null means retry. tostring (not `// "null"`)
            # so a genuine false isn't mistaken for null and burns a retry for nothing.
            mergeable=null
            for _ in 1 2 3; do
              mergeable=$(gh api "repos/$REPO/pulls/${number}" --jq '.mergeable | tostring')
              [ "$mergeable" != "null" ] && break
              sleep 5
            done

            if [ "$mergeable" != "true" ]; then
              note "#${number}: not cleanly mergeable (mergeable=${mergeable})"
              comment_once "$number" "<!-- auto-merge:rebase:${head_sha} -->" "@dependabot rebase" \
                && note "#${number}: asked Dependabot to rebase" || true
              [ "$age" -ge "$STALE_DAYS" ] && stuck=1
              continue
            fi

            # A PR touching a workflow file can only merge while level with base —
            # behind it, GitHub refuses ("without workflows permission"). Read into
            # variables, not piped, for the same SIGPIPE reason as comment_once.
            behind_by=$(gh api "repos/$REPO/compare/${DEPS_BRANCH}...${head_sha}" --jq '.behind_by')
            changed=$(gh api --paginate "repos/$REPO/pulls/${number}/files?per_page=100" --jq '.[].filename')

            if [ "$behind_by" -gt 0 ] && grep -q '^\.github/workflows/' <<<"$changed"; then
              note "#${number}: edits a workflow and is ${behind_by} behind; a merge would be refused"
              comment_once "$number" "<!-- auto-merge:rebase:${head_sha} -->" "@dependabot rebase" \
                && note "#${number}: asked Dependabot to rebase" || true
              [ "$age" -ge "$STALE_DAYS" ] && stuck=1
              continue
            fi

            # --match-head-commit: merge exactly the commit CI passed, in case the
            # head moved (a Dependabot rebase, another push) since that run.
            if gh pr merge "$number" \
                --repo "$REPO" \
                --squash \
                --delete-branch \
                --match-head-commit "$head_sha"; then
              note "#${number}: merged ${head_sha:0:7} into ${DEPS_BRANCH}"
              merged=$((merged + 1))
            else
              echo "::error::#${number} passed CI but could not be merged into ${DEPS_BRANCH}."
              note "#${number}: MERGE FAILED after green CI — see the log"
              # Not subject to STALE_DAYS: this one is the automation's own fault.
              stuck=1
            fi
          done

          # Security-update PRs ignore target-branch and land on the default branch
          # regardless, so they never appear in the sweep above and could sit
          # invisible indefinitely — surface them instead.
          stranded=$(gh api --paginate \
            "repos/$REPO/pulls?state=open&base=${BASE_BRANCH}&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | "\(.number)\t\(.created_at)\t\(.title)"')

          if [ -n "$stranded" ]; then
            echo ""
            echo "::warning::Dependabot pull requests are open against ${BASE_BRANCH}, not ${DEPS_BRANCH}."
            while IFS=$'\t' read -r n created t; do
              a=$(age_days "$created")
              note "on ${BASE_BRANCH} (security update, needs a human): #${n} ${t} — ${a}d old"
              [ "$a" -ge "$STALE_DAYS" ] && stuck=1
            done <<<"$stranded"
          fi

          if [ "$stuck" -ne 0 ]; then
            echo "::error::Dependency updates are stuck. This run is red so somebody hears about it."
          fi
          exit "$stuck"

      # A GITHUB_TOKEN push raises no events, so without this explicit dispatch the
      # merge would never get rebuilt or the promotion PR refreshed until the next
      # schedule.
      - name: Build the merged result and refresh the promotion
        if: always() && steps.sweep.outputs.merged != '0' && steps.sweep.outputs.merged != ''
        run: |
          gh workflow run "$CI_WORKFLOW" --repo "$REPO" --ref "$DEPS_BRANCH"
          gh workflow run deps-promote.yml --repo "$REPO" --ref "$BASE_BRANCH"

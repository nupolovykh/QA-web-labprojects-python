name: Dependency promotion

# Carries what `deps` collected back into main as one PR a human merges, then
# re-cuts `deps` from main afterward.
#
# No main -> deps merge: `deps` only ever holds bot commits, which are
# regenerable (reset it and Dependabot re-raises the same bumps), whereas
# merging main into it would hit lockfile conflicts on almost every line, with
# a human left to resolve a generated file by hand on a branch nobody watches.
# The guard below keeps that assumption true — one human commit on `deps` and
# this workflow refuses to reset anything.
#
# No checkout here either, same reason as the auto-merge gate: no working tree
# for a push to `deps` to poison.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  # A push to main covers both the amend case and the merged-promotion case;
  # `deps` needs realigning either way.
  push:
    branches: [main]

# Governs GITHUB_TOKEN, which this job does not use — every call authenticates
# as DEPS_PAT, whose own scopes are the real limit. Kept at zero so the unused
# token grants nothing.
permissions: {}

concurrency:
  group: dependency-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.DEPS_PAT }}
      REPO: ${{ github.repository }}
      DEPS_BRANCH: deps
      BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      CI_WORKFLOW: ci.yml
      # main's pre-rewrite tip on a force-push (what `git commit --amend`
      # produces) — the only way to tell "deps just holds main's replaced
      # history" from "someone committed to deps by hand". Empty otherwise.
      FORCED_BEFORE: ${{ (github.event_name == 'push' && github.event.forced) && github.event.before || '' }}
    steps:
      - name: Promote, or realign the branch
        run: |
          set -euo pipefail

          owner="${REPO%%/*}"
          title="Dependency updates: promote \`${DEPS_BRANCH}\` to \`${BASE_BRANCH}\`"

          base_sha=$(gh api "repos/$REPO/git/ref/heads/${BASE_BRANCH}" --jq '.object.sha')

          # Bootstrap. Also the recovery path if somebody deletes the branch.
          if ! gh api "repos/$REPO/git/ref/heads/${DEPS_BRANCH}" >/dev/null 2>&1; then
            gh api "repos/$REPO/git/refs" \
              -f "ref=refs/heads/${DEPS_BRANCH}" -f "sha=${base_sha}" >/dev/null
            echo "Created ${DEPS_BRANCH} at ${base_sha:0:7}. Dependabot will target it from its next scan."
            exit 0
          fi

          find_open_pr() {
            gh api "repos/$REPO/pulls?state=open&base=${BASE_BRANCH}&head=${owner}:${DEPS_BRANCH}" \
              --jq '.[0].number // empty'
          }

          close_pr() {
            local n="$1"
            [ -z "$n" ] && return 0
            gh api -X PATCH "repos/$REPO/pulls/${n}" -f "state=closed" >/dev/null
            echo "Closed #${n} — nothing left to promote."
          }

          reset_deps() {
            gh api -X PATCH "repos/$REPO/git/refs/heads/${DEPS_BRANCH}" \
              -f "sha=${base_sha}" -F "force=true" >/dev/null
            echo "Reset ${DEPS_BRANCH} to ${BASE_BRANCH} (${base_sha:0:7})."
          }

          compare=$(gh api "repos/$REPO/compare/${BASE_BRANCH}...${DEPS_BRANCH}")
          status=$(jq -r '.status' <<<"$compare")
          ahead_by=$(jq -r '.ahead_by' <<<"$compare")
          # ahead_by counts commits, not content; files_changed is what matters for review.
          files_changed=$(jq -r '(.files // []) | length' <<<"$compare")
          number=$(find_open_pr)

          echo "${DEPS_BRANCH} is '${status}' relative to ${BASE_BRANCH}: ${ahead_by} commit(s), ${files_changed} file(s) changed."

          # Any commit on deps not written by a bot breaks the disposability
          # assumption. Merge commits are the exception: the only thing that
          # creates one here is this workflow bringing the base branch in through
          # update-branch, which is attributed to whoever owns DEPS_PAT. Hand work
          # on deps arrives as an ordinary single-parent commit, so excluding
          # merges keeps the guard aimed at what it is for.
          bot_filter='select((.parents | length) < 2) | (.author.login // "") as $l | select($l != "dependabot[bot]" and $l != "github-actions[bot]")'
          nonbot=$(jq -r "[ .commits[] | ${bot_filter} | \"\\(.sha[0:7]) \\(.commit.author.name): \\(.commit.message | split(\"\\n\")[0])\" ] | .[]" <<<"$compare")
          nonbot_shas=$(jq -r "[ .commits[] | ${bot_filter} | .sha ] | .[]" <<<"$compare")

          # True only if every non-bot commit on deps is main's own pre-amend
          # history (nothing of anyone's is actually being carried).
          amend_debris=false
          if [ -n "$nonbot_shas" ] && [ -n "$FORCED_BEFORE" ]; then
            amend_debris=true
            for sha in $nonbot_shas; do
              # identical/ahead means sha predates the rewrite.
              rel=$(gh api "repos/$REPO/compare/${sha}...${FORCED_BEFORE}" --jq '.status' 2>/dev/null || echo unknown)
              case "$rel" in
                identical|ahead) ;;
                *) amend_debris=false ;;
              esac
            done
          fi

          case "$status" in
            identical)
              echo "Nothing to promote."
              close_pr "$number"
              exit 0
              ;;

            behind)
              # The ordinary case after the promotion PR merges with a merge commit.
              # force=false refuses anything that isn't a fast-forward, guarding
              # against the auto-merge gate landing something mid-call.
              if gh api -X PATCH "repos/$REPO/git/refs/heads/${DEPS_BRANCH}" \
                   -f "sha=${base_sha}" -F "force=false" >/dev/null 2>&1; then
                echo "Fast-forwarded ${DEPS_BRANCH} to ${base_sha:0:7}."
              else
                echo "::notice::${DEPS_BRANCH} moved while this run was reading it; the next run realigns it."
              fi
              close_pr "$number"
              exit 0
              ;;

            diverged)
              if [ -n "$nonbot" ] && [ "$amend_debris" = true ]; then
                # main was amended; the stranded commits are just its replaced tip,
                # not real work. Re-cut deps; its bot commits come back on Dependabot's
                # next scan.
                echo "::notice::${BASE_BRANCH} was amended; ${DEPS_BRANCH} still points at the replaced history."
                jq -r '.commits[] | "  dropped: " + (.commit.message | split("\n")[0])' <<<"$compare"
                reset_deps
                close_pr "$number"
                exit 0
              fi

              if [ -n "$nonbot" ]; then
                echo "::error::${DEPS_BRANCH} carries commits that are not from a bot, so it is not safe to reset."
                echo "$nonbot" | sed 's/^/  /'
                echo ""
                echo "Two things cause this:"
                echo "  1. Somebody committed to ${DEPS_BRANCH} by hand. That branch is bot-only;"
                echo "     move the work to a feature branch off ${BASE_BRANCH}."
                echo "  2. ${BASE_BRANCH} was amended, which strands its previous tip here."
                echo "     Nothing on ${DEPS_BRANCH} is worth keeping — Dependabot re-raises every"
                echo "     bump on its next scan — so realign it and let the queue refill:"
                echo ""
                echo "       git fetch origin ${BASE_BRANCH}"
                echo "       git push --force origin origin/${BASE_BRANCH}:${DEPS_BRANCH}"
                {
                  echo "### Dependency promotion blocked"
                  echo
                  echo "\`${DEPS_BRANCH}\` holds commits that are not from a bot; it was not reset."
                  echo '```'
                  echo "$nonbot"
                  echo '```'
                } >>"$GITHUB_STEP_SUMMARY"
                exit 1
              fi

              if [ "$files_changed" -eq 0 ]; then
                # Squash/rebase merge landed the same tree under different commits.
                echo "${BASE_BRANCH} already contains everything on ${DEPS_BRANCH}."
                reset_deps
                close_pr "$number"
                exit 0
              fi

              # Everything left here is bot-only with real file changes, which is
              # not a rewrite: a rewrite strands main's own previous tip on deps,
              # and that tip is a human commit caught by the two branches above.
              # So this is the ordinary case of main moving on while deps held
              # bumps. It used to drop them and close the promotion pull request,
              # which meant the queue restarted on every commit to main and, once
              # security updates are enabled, on every security fix merged.
              if [ -n "$FORCED_BEFORE" ]; then
                echo "::warning::${BASE_BRANCH} was force-pushed while ${DEPS_BRANCH} held ${ahead_by} bump(s)."
                echo "Re-cutting the branch; Dependabot re-raises them on its next scan."
                jq -r '.commits[] | "  dropped: " + (.commit.message | split("\n")[0])' <<<"$compare"
                reset_deps
                close_pr "$number"
                exit 0
              fi

              if [ -n "$number" ]; then
                # Server-side merge of the base into the head, which is the only way
                # to do it without a working tree — and there is deliberately no
                # checkout in this workflow.
                if gh api --method PUT "repos/$REPO/pulls/${number}/update-branch" >/dev/null 2>&1; then
                  echo "Brought ${BASE_BRANCH} into ${DEPS_BRANCH} through #${number}; the ${ahead_by} bump(s) are intact."
                  exit 0
                fi
                echo "::warning::Could not bring ${BASE_BRANCH} into ${DEPS_BRANCH} — a conflict, or the write was refused."
                echo "Re-cutting the branch; Dependabot re-raises every bump on its next scan."
                jq -r '.commits[] | "  dropped: " + (.commit.message | split("\n")[0])' <<<"$compare"
                reset_deps
                close_pr "$number"
                exit 0
              fi

              echo "${BASE_BRANCH} moved on; opening the promotion for the ${ahead_by} bump(s) as they stand."
              ;;

            ahead) ;;

            *)
              echo "::error::Unexpected compare status '${status}'."
              exit 1
              ;;
          esac

          # deps sits ahead of main with updates to promote.
          if [ "$files_changed" -eq 0 ]; then
            echo "${ahead_by} commit(s) ahead but no file changes; nothing worth a review."
            close_pr "$number"
            exit 0
          fi

          if [ -n "$nonbot" ]; then
            echo "::warning::${DEPS_BRANCH} carries non-bot commits. It is meant to be bot-only:"
            echo "$nonbot" | sed 's/^/  /'
          fi

          commits=$(jq -r '.commits[] | "- " + (.commit.message | split("\n")[0])' <<<"$compare")

          body="Collected dependency updates from \`${DEPS_BRANCH}\`.

          Each commit below merged itself only after CI passed on that exact commit.
          This pull request runs CI once more on the combined result: the updates are
          green in isolation, the promotion proves they are green together.

          Merge it with squash, rebase or a merge commit — all three are handled. The
          next run of this workflow re-cuts \`${DEPS_BRANCH}\` from \`${BASE_BRANCH}\`
          afterwards, so the branch never accumulates history and never conflicts.

          ### ${ahead_by} update(s)

          ${commits}

          <!-- opened and refreshed by .github/workflows/deps-promote.yml -->"

          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$REPO/pulls/${number}" -f "body=${body}" >/dev/null
            echo "Refreshed #${number} (${ahead_by} updates)."
            exit 0
          fi

          if ! output=$(gh api "repos/$REPO/pulls" \
              -f "title=${title}" -f "head=${DEPS_BRANCH}" \
              -f "base=${BASE_BRANCH}" -f "body=${body}" 2>&1); then
            echo "$output"
            case "$output" in
              *"not permitted to create or approve pull requests"*)
                echo "::error::Actions may not open pull requests in this repository."
                echo "Settings -> Actions -> General -> Workflow permissions ->"
                echo "tick 'Allow GitHub Actions to create and approve pull requests'."
                echo "Until then ${ahead_by} update(s) sit on ${DEPS_BRANCH} with no way out."
                ;;
              *)
                echo "::error::Could not open the promotion pull request."
                ;;
            esac
            exit 1
          fi

          new_number=$(jq -r '.number' <<<"$output")
          echo "Opened #${new_number} (${ahead_by} updates)."

          # A PR opened via the API starts no workflow run and would carry no
          # checks; dispatch CI on deps's head so it shows up as this PR's own.
          gh workflow run "$CI_WORKFLOW" --repo "$REPO" --ref "$DEPS_BRANCH"
          echo "Dispatched ${CI_WORKFLOW} on ${DEPS_BRANCH} so the promotion has checks."

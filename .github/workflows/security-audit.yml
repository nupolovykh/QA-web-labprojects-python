name: Security audit

# Deliberately NOT part of CI.
#
# `pip-audit` answers a question about the global advisory database, not about
# the commit under test. A newly published advisory turns every open pull request
# red at once — including the very bump that fixes it — and in a repository where
# green CI is what merges updates, that stops the updates from landing exactly
# when they matter most. Here it reports on a schedule and blocks nothing.
#
# It is also the one workflow that speaks about `main` itself. Dependabot's
# security updates ignore `target-branch` and never enter the `deps` flow, so
# this report is the only place the whole picture is written down.
#
# One job, not a matrix over the requirements files. Four parallel jobs would
# race for the single report issue: each would read the issue list before the
# others had written, and the losers would file duplicates or close the issue a
# sibling had just opened.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

# GITHUB_TOKEN is enough here: the only thing this writes is the report issue.
permissions:
  contents: read
  issues: write

jobs:
  pip:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pip-audit

      # Requirements files are discovered rather than listed, so a lab added
      # later is audited without anybody remembering to edit this file. The
      # development-scoped one is included on purpose: the enabled Dependabot
      # rule preset dismisses low-impact advisories against it and never raises
      # an alert, so this audit is the only report it gets.
      #
      # Audits the pinned requirements rather than an installed environment, so
      # a lab that cannot install on a runner is still covered.
      - name: Audit every requirements file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Explicit: the step's shell is `bash -e`, and this script handles its
          # own failures rather than dying at the first one.
          set +e
          set -uo pipefail
          audited=0
          affected=0
          details=""

          while IFS= read -r req; do
            echo "::group::${req}"
            # `if` context, not a bare assignment: `pip-audit --strict` exits
            # non-zero precisely when it finds something or cannot resolve a
            # dependency, and under `bash -e` a bare assignment would kill the
            # script on the first finding, before anything could be reported.
            if report=$(pip-audit --requirement "$req" --strict 2>&1); then
              rc=0
            else
              rc=$?
            fi
            printf '%s\n' "$report"
            audited=$((audited + 1))
            if [ "$rc" -ne 0 ]; then
              affected=$((affected + 1))
              line=$(grep -E 'found [0-9]+|vulnerabilit' <<<"$report" | tail -1)
              details="${details}
          - \`${req}\` — ${line:-see the run log}"
              echo "::warning::pip-audit reported on ${req}"
            fi
            echo "::endgroup::"
          done < <(find . -name 'requirements*.txt' -not -path './.git/*' | sort)

          summary="Audited ${audited} requirements file(s); ${affected} reported something."
          echo "$summary"

          # The finding is an issue, not a failed run: this workflow runs on a
          # schedule against the default branch, so a failure would pin a red
          # check to whatever commit that branch points at — permanently, since a
          # check run cannot be deleted and the mark outlives the fix.
          marker="<!-- vulnerable-dependencies -->"
          issues=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | "\(.number)\t\(.body // "")"' 2>/dev/null || true)
          issue=$(awk -v m="$marker" -F'\t' 'index($0, m) {print $1; exit}' <<<"$issues")

          if [ "$affected" -gt 0 ] || [ "$audited" -eq 0 ]; then
            if [ "$audited" -eq 0 ]; then
              detail="No requirements file was found, so this run proves nothing."
            else
              detail="${affected} requirements file(s) pin packages with advisories, or could not be resolved."
            fi
            body="${detail}
          ${details}

          ${summary}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ${marker}"
            if [ -n "$issue" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/${issue}" -f "body=${body}" >/dev/null \
                && { echo "::warning::${detail} Updated issue #${issue}."; exit 0; }
            else
              issue=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f "title=Vulnerable dependencies" \
                -f "body=${body}" --jq '.number' 2>/dev/null) \
                && { echo "::warning::${detail} Opened issue #${issue}."; exit 0; }
            fi
            echo "::error::${detail} The report could not be filed, so this run fails instead."
            exit 1
          fi

          if [ -n "$issue" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/${issue}" \
              -f state=closed -f state_reason=completed >/dev/null 2>&1 || true
            echo "Nothing left to report; closed issue #${issue}."
          fi
